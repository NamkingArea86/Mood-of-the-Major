<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ดูโพสต์โดยรวม</title>
<script src="js/api.js"></script>
<script src="js/feed.js" defer></script>
<style>
  * { box-sizing: border-box; font-family: 'Inter', 'IBM Plex Sans Thai', sans-serif; }
  html, body { margin: 0; padding: 0; background: #FBF8F1; width: 100%; }

  .navbar { width: 100%; display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; background: #FFFFFF; padding: 14px 28px; border-bottom: 1px solid #e7e7e7; }
  .logo {display: flex; align-items: center; gap: 10px; font-size: 28px; font-weight: 500;}
  .logo span {font-size: 16px;}
  .nav-menu {display: flex; gap: 12px; flex-wrap: wrap;}
  .nav-link { text-decoration: none; color: #555; padding: 8px 18px; border-radius: 25px; transition:.2s;}
  .nav-link:hover {background: #f5f1e8; border-color: #f5f1e8;}
  .nav-link.active {background: #1A1A1A; color: #FFFFFF; border-color: #1A1A1A;}

  .page-content { padding: 32px; }
  .toolbar { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 18px; }
  select { height: 32px; border: 0.5px solid rgba(0,0,0,0.12); border-radius: 8px; padding: 0 10px; font-size: 12px; background: #FFFFFF; color: #1A1A1A; }
  .btn-post { margin-left: auto; height: 32px; background: #1A1A1A; color: #FFFFFF; border: none; border-radius: 8px; font-size: 12px; padding: 0 14px; cursor: pointer; }
  .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 12px; }
  .card { background: #FFFFFF; border-radius: 12px; padding: 14px; }
  .card .meta { font-size: 11px; color: #8A8A82; margin: 0 0 6px; }
  .card .emoji { font-size: 22px; margin: 0 0 8px; }
  .card .text { font-size: 13px; color: #1A1A1A; margin: 0; word-break: break-word; }
  .mood-happy { border-left: 3px solid #EF9F27; }
  .mood-stressed { border-left: 3px solid #7F77DD; }
  .mood-tired { border-left: 3px solid #B4B2A9; }
  .mood-neutral { border-left: 3px solid #888780; }
  .mood-sad { border-left: 3px solid #378ADD; }
  .empty-msg { color: #8A8A82; font-size: 13px; text-align: center; padding: 40px 0; grid-column: 1 / -1; }

  @media (max-width: 768px) {
    .navbar { padding: 12px 20px; }
    .logo { font-size: 22px; }
    .logo span { font-size: 14px; }
    .nav-link { padding: 6px 12px; font-size: 12px; }
    .page-content { padding: 20px; }
  }
  @media (max-width: 480px) {
    .navbar { flex-direction: column; align-items: flex-start; gap: 10px; padding: 10px 14px; }
    .nav-menu { width: 100%; justify-content: space-between; gap: 4px; }
    .nav-link { padding: 6px 8px; font-size: 11px; }
    .page-content { padding: 14px; }
    .toolbar { flex-direction: column; }
    .btn-post { margin-left: 0; width: 100%; height: 38px; }
    select { width: 100%; }
    .grid { grid-template-columns: 1fr; }
  }
</style>
</head>
<body>
  <nav class="navbar">
    <div class="logo">
        🌻 <span>Mood of the Major</span>
    </div>
    <div class="nav-menu">
        <a href="3-feed.html" class="nav-link active">Feed</a>
        <a href="4-post.html" class="nav-link">Post</a>
        <a href="7-summary.html" class="nav-link">สรุป</a>
        <a href="6-profile.html" class="nav-link">Profile</a>
    </div>
  </nav>

  <div class="page-content">
    <div class="toolbar">
      <select id="filterMood">
        <option value="">อารมณ์: ทั้งหมด</option>
        <option value="happy">😊 มีความสุข</option>
        <option value="stressed">😰 เครียด</option>
        <option value="tired">😴 เหนื่อย</option>
        <option value="neutral">😐 เฉยๆ</option>
        <option value="sad">😢 เศร้า</option>
      </select>
      <select id="filterFaculty">
        <option value="">คณะ: ทั้งหมด</option>
        <option value="วิศวกรรมศาสตร์">คณะวิศวกรรมศาสตร์</option>
        <option value="สถาปัตยกรรม">คณะสถาปัตยกรรม</option>
        <option value="ศิลปศาสตร์">คณะศิลปศาสตร์</option>
        <option value="นิเทศศาสตร์">คณะนิเทศศาสตร์</option>
        <option value="บริหารธุรกิจ">คณะบริหารธุรกิจ</option>
      </select>
      <button class="btn-post" onclick="location.href='4-post.html'">+ โพสต์อารมณ์</button>
    </div>
    <div class="grid" id="moodGrid">
      <p class="empty-msg">กำลังโหลด...</p>
    </div>
  </div>
</body>
</html>
