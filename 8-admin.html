<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<title>Admin panel</title>
<style>
  * { box-sizing: border-box; font-family: 'Inter', 'IBM Plex Sans Thai', sans-serif; }
  body { margin: 0; background: #FBF8F1; padding: 32px; }
  .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; max-width: 700px; }
  .card { background: #FFFFFF; border-radius: 16px; padding: 20px; }
  h2 { font-size: 13px; font-weight: 500; color: #1A1A1A; margin: 0 0 12px; }
  .report-row { background: #F5F1E8; border-radius: 10px; padding: 10px 12px; display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; }
  .report-row .meta { font-size: 11px; color: #8A8A82; margin: 0 0 2px; }
  .report-row .text { font-size: 12px; color: #1A1A1A; margin: 0; }
  .btn-danger { font-size: 11px; color: #FFFFFF; background: #A32D2D; border: none; border-radius: 6px; height: 26px; padding: 0 10px; }
  input.search { width: 100%; height: 32px; border: 0.5px solid rgba(0,0,0,0.12); border-radius: 8px; padding: 0 10px; font-size: 12px; margin-bottom: 10px; }
  .promote-row { background: #F5F1E8; border-radius: 10px; padding: 10px 12px; display: flex; justify-content: space-between; align-items: center; }
  .promote-row p { font-size: 12px; color: #1A1A1A; margin: 0; }
  .btn-outline { font-size: 11px; border: 0.5px solid rgba(0,0,0,0.15); background: transparent; border-radius: 6px; height: 26px; padding: 0 10px; }
</style>
</head>
<body>
  <div class="grid">
    <div class="card">
      <h2>โพสต์ที่ถูกรายงาน</h2>
      <div class="report-row">
        <div>
          <p class="meta">นิเทศศาสตร์ · 😢</p>
          <p class="text">เนื้อหาไม่เหมาะสม...</p>
        </div>
        <button class="btn-danger">ลบ</button>
      </div>
    </div>
    <div class="card">
      <h2>เลื่อนขั้นผู้ใช้</h2>
      <input class="search" placeholder="ค้นหารหัสนักศึกษา" />
      <div class="promote-row">
        <p>6512345 · role: user</p>
        <button class="btn-outline">เลื่อนเป็น Admin</button>
      </div>
    </div>
  </div>
</body>
</html>
