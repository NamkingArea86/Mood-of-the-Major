<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>เข้าสู่ระบบ</title>
<style>
  * { box-sizing: border-box; font-family: 'Inter', 'IBM Plex Sans Thai', sans-serif; }
  body { margin: 0; background: #FBF8F1; padding: 60px 20px; display: flex; justify-content: center; }
  .card { background: #FFFFFF; border: 0.5px solid rgba(0,0,0,0.1); border-radius: 16px; padding: 28px 24px; width: 100%; max-width: 340px; }
  .logo { width: 44px; height: 44px; border-radius: 50%; background: #1A1A1A; margin: 0 auto 10px; display: flex; align-items: center; justify-content: center; color: #F5F1E8; font-size: 20px; }
  .heading { text-align: center; margin-bottom: 24px; }
  .heading h1 { font-size: 16px; font-weight: 500; color: #1A1A1A; margin: 0; }
  .heading p { font-size: 12px; color: #8A8A82; margin: 4px 0 0; }
  label { font-size: 12px; color: #6B6B65; display: block; margin-bottom: 4px; }
  input { width: 100%; height: 38px; border: 0.5px solid rgba(0,0,0,0.12); border-radius: 8px; padding: 0 12px; font-size: 14px; color: #1A1A1A; margin-bottom: 14px; background: #FFFFFF; }
  .btn-primary { width: 100%; height: 40px; background: #1A1A1A; color: #FFFFFF; border: none; border-radius: 8px; font-size: 14px; font-weight: 500; margin-top: 4px; cursor: pointer; }
  .footer { text-align: center; font-size: 12px; color: #8A8A82; margin-top: 14px; }
  .footer a { text-decoration: none; }
  .footer span { color: #1A1A1A; font-weight: 500; }

  /* ===== Responsive ===== */
  @media (max-width: 768px) {
    body { padding: 40px 16px; }
  }
  @media (max-width: 480px) {
    body { padding: 24px 12px; }
    .card { padding: 22px 18px; border-radius: 14px; }
  }
</style>
</head>
<body>
  <div class="card">
    <div class="logo">◕</div>
    <div class="heading">
      <h1>Mood of the Major</h1>
      <p>เข้าสู่ระบบด้วยรหัสนักศึกษา</p>
    </div>
    <label>รหัสนักศึกษา</label>
    <input placeholder="6512345" />
    <label>รหัสผ่าน</label>
    <input type="password" placeholder="••••••••" />
    <button class="btn-primary" onclick="location.href='3-feed.html'">เข้าสู่ระบบ</button>
    <p class="footer">ยังไม่มีบัญชี? <a href="1-register.html"><span>สมัครสมาชิก</span></a></p>
  </div>
</body>
</html>
