<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>แก้ไขโพสต์</title>
<style>
  * { box-sizing: border-box; font-family: 'Inter', 'IBM Plex Sans Thai', sans-serif; }
  body { margin: 0; background: #FBF8F1; padding: 60px 20px; display: flex; justify-content: center; }
  .card { background: #FFFFFF; border-radius: 16px; padding: 24px; width: 100%; max-width: 400px; }
  h1 { font-size: 15px; font-weight: 500; color: #1A1A1A; margin: 0 0 16px; }
  .mood-row { display: flex; gap: 8px; margin-bottom: 16px; flex-wrap: wrap; }
  .mood-btn { width: 44px; height: 44px; border-radius: 10px; border: 0.5px solid rgba(0,0,0,0.1); display: flex; align-items: center; justify-content: center; font-size: 20px; background: #FFFFFF; }
  .mood-btn.selected { border: 2px solid #7F77DD; background: #EEEDFE; }
  textarea { width: 100%; height: 80px; border: 0.5px solid rgba(0,0,0,0.12); border-radius: 8px; padding: 10px 12px; font-size: 14px; color: #1A1A1A; margin-bottom: 16px; resize: none; }
  .row { display: flex; gap: 10px; }
  .btn-primary { flex: 1; height: 40px; background: #1A1A1A; color: #FFFFFF; border: none; border-radius: 8px; font-size: 14px; font-weight: 500; }
  .btn-secondary { flex: 1; height: 40px; background: transparent; color: #1A1A1A; border: 0.5px solid rgba(0,0,0,0.15); border-radius: 8px; font-size: 14px; }

  /* ===== Responsive ===== */
  @media (max-width: 768px) {
    body { padding: 40px 16px; }
  }
  @media (max-width: 480px) {
    body { padding: 24px 12px; }
    .card { padding: 20px 16px; }
    .mood-btn { width: 40px; height: 40px; }
    .row { flex-direction: column; }
  }
</style>
</head>
<body>
  <div class="card">
    <h1>แก้ไขโพสต์ของคุณ</h1>
    <div class="mood-row">
      <div class="mood-btn">😊</div>
      <div class="mood-btn selected">😰</div>
      <div class="mood-btn">😴</div>
      <div class="mood-btn">😐</div>
      <div class="mood-btn">😢</div>
    </div>
    <textarea>งานส่งพรุ่งนี้ยังไม่เสร็จเลย</textarea>
    <div class="row">
      <button class="btn-secondary">ยกเลิก</button>
      <button class="btn-primary">บันทึกการแก้ไข</button>
    </div>
  </div>
</body>
</html>
