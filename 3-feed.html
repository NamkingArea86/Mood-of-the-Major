<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<title>ดูโพสต์โดยรวม</title>
<style>
  * { box-sizing: border-box; font-family: 'Inter', 'IBM Plex Sans Thai', sans-serif; }
  body { margin: 0; background: #FBF8F1; padding: 32px; }
  .toolbar { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 18px; }
  select { height: 32px; border: 0.5px solid rgba(0,0,0,0.12); border-radius: 8px; padding: 0 10px; font-size: 12px; background: #FFFFFF; color: #1A1A1A; }
  .btn-post { margin-left: auto; height: 32px; background: #1A1A1A; color: #FFFFFF; border: none; border-radius: 8px; font-size: 12px; padding: 0 14px; }
  .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 12px; }
  .card { background: #FFFFFF; border-radius: 12px; padding: 14px; }
  .card .meta { font-size: 11px; color: #8A8A82; margin: 0 0 6px; }
  .card .emoji { font-size: 22px; margin: 0 0 8px; }
  .card .text { font-size: 13px; color: #1A1A1A; margin: 0; }
  .mood-happy { border-left: 3px solid #EF9F27; }
  .mood-stressed { border-left: 3px solid #7F77DD; }
  .mood-tired { border-left: 3px solid #B4B2A9; }
  .mood-neutral { border-left: 3px solid #888780; }
  .mood-sad { border-left: 3px solid #378ADD; }
</style>
</head>
<body>
  <div class="toolbar">
    <select><option>อารมณ์: ทั้งหมด</option></select>
    <select><option>วันที่: ทั้งหมด</option></select>
    <select><option>คณะ: ทั้งหมด</option></select>
    <button class="btn-post">+ โพสต์อารมณ์</button>
  </div>
  <div class="grid">
    <div class="card mood-happy">
      <p class="meta">วิศวกรรมศาสตร์ · 2 ชม.</p>
      <p class="emoji">😊</p>
      <p class="text">สอบผ่านแล้ว โล่งอก!</p>
    </div>
    <div class="card mood-stressed">
      <p class="meta">ศิลปศาสตร์ · 4 ชม.</p>
      <p class="emoji">😰</p>
      <p class="text">งานส่งพรุ่งนี้ยังไม่เสร็จเลย</p>
    </div>
    <div class="card mood-sad">
      <p class="meta">นิเทศศาสตร์ · 6 ชม.</p>
      <p class="emoji">😢</p>
      <p class="text">คิดถึงบ้านจัง</p>
    </div>
    <div class="card mood-neutral">
      <p class="meta">วิศวกรรมศาสตร์ · 1 วัน</p>
      <p class="emoji">😐</p>
      <p class="text">วันนี้เรื่อยๆ ไม่มีอะไรพิเศษ</p>
    </div>
    <div class="card mood-tired">
      <p class="meta">บริหารธุรกิจ · 1 วัน</p>
      <p class="emoji">😴</p>
      <p class="text">นอนไม่พอเลยสัปดาห์นี้</p>
    </div>
  </div>
</body>
</html>
