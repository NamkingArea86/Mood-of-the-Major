<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin panel</title>
<script src="js/api.js"></script>
<script src="js/admin.js" defer></script>
<style>
  * { box-sizing: border-box; font-family: 'Inter', 'IBM Plex Sans Thai', sans-serif; }
  html, body { margin: 0; padding: 0; background: #FBF8F1; width: 100%; }

  .navbar { width: 100%; display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; background: #FFFFFF; padding: 14px 28px; border-bottom: 1px solid #e7e7e7; }
  .logo {display: flex; align-items: center; gap: 10px; font-size: 28px; font-weight: 500;}
  .logo span {font-size: 16px;}
  .nav-menu {display: flex; gap: 12px; flex-wrap: wrap;}
  .nav-link { text-decoration: none; color: #555; padding: 8px 18px; border-radius: 25px; transition:.2s;}
  .nav-link:hover {background: #f5f1e8; border-color: #f5f1e8;}
  .nav-link.active {background: #1A1A1A; color: #FFFFFF; border-color: #1A1A1A;}

  .page-content { padding: 32px; }
  .container {display: flex;justify-content: center; align-items: center; padding: 60px 40px; width: 100%;}
  .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 24px; width: 90%; max-width: 900px; }
  .card { background: #FFFFFF; border-radius: 16px; padding: 30px; }
  h2 { font-size: 13px; font-weight: 500; color: #1A1A1A; margin: 0 0 12px; }
  .report-row { background: #F5F1E8; border-radius: 10px; padding: 10px 12px; display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; flex-wrap: wrap; gap: 8px; }
  .report-row .meta { font-size: 11px; color: #8A8A82; margin: 0 0 2px; }
  .report-row .text { font-size: 12px; color: #1A1A1A; margin: 0; }
  .btn-danger { font-size: 11px; color: #FFFFFF; background: #A32D2D; border: none; border-radius: 6px; height: 26px; padding: 0 10px; cursor: pointer; transition: 0.2s; }
  .btn-danger:hover { background: #822222; }
  
  input.search { width: 100%; height: 32px; border: 0.5px solid rgba(0,0,0,0.12); border-radius: 8px; padding: 0 10px; font-size: 12px; margin-bottom: 10px; }
  .promote-row { background: #F5F1E8; border-radius: 10px; padding: 10px 12px; display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; flex-wrap: wrap; gap: 8px; }
  .promote-row p { font-size: 12px; color: #1A1A1A; margin: 0; }
  .btn-outline { font-size: 11px; border: 0.5px solid rgba(0,0,0,0.15); background: transparent; border-radius: 6px; height: 26px; padding: 0 10px; cursor: pointer; transition: 0.2s; }
  .btn-outline:hover { background: #e8e3d8; }
  .empty-msg { font-size: 12px; color: #8A8A82; text-align: center; padding: 12px 0; }

  /* ===== Responsive ===== */
  @media (max-width: 900px) {
    .grid { grid-template-columns: 1fr; }
  }
  @media (max-width: 768px) {
    .navbar { padding: 12px 20px; }
    .logo { font-size: 22px; }
    .logo span { font-size: 14px; }
    .nav-link { padding: 6px 12px; font-size: 12px; }
    .page-content { padding: 20px; }
    .container { padding: 30px 16px; }
  }
  @media (max-width: 480px) {
    .navbar { flex-direction: column; align-items: flex-start; gap: 10px; padding: 10px 14px; }
    .nav-menu { width: 100%; justify-content: space-between; gap: 4px; }
    .nav-link { padding: 6px 8px; font-size: 11px; }
    .page-content { padding: 14px; }
    .container { padding: 20px 10px; }
    .card { padding: 20px; }
  }
</style>
</head>
<body>
  <nav class="navbar">
    <div class="logo">
        🌻 <span>Mood of the Major</span>
    </div>
    <div class="nav-menu">
        <a href="3-feed.html" class="nav-link">Feed</a>
        <a href="4-post.html" class="nav-link">Post</a>
        <a href="7-summary.html" class="nav-link">สรุป</a>
        <a href="8-admin.html" class="nav-link active">Admin</a>
        <a href="6-profile.html" class="nav-link">Profile</a>
    </div>
  </nav>

  <div class="page-content">
    <div class="container">
      <div class="grid">
        <!-- การ์ดฝั่งซ้าย: จัดการลบโพสต์ที่ไม่เหมาะสม -->
        <div class="card">
          <h2>โพสต์ทั้งหมดในระบบ (จัดการลบ)</h2>
          <div id="postsListContainer">
            <p class="empty-msg">กำลังโหลดโพสต์...</p>
          </div>
        </div>

        <!-- การ์ดฝั่งขวา: ค้นหาและจัดการเลื่อนขั้น Admin -->
        <div class="card">
          <h2>เลื่อนขั้นผู้ใช้</h2>
          <input type="text" id="userSearchInput" class="search" placeholder="ค้นหารหัสนักศึกษา..." onkeyup="filterUsers()" />
          <div id="usersListContainer">
            <p class="empty-msg">กำลังโหลดข้อมูลผู้ใช้...</p>
          </div>
        </div>
      </div>
    </div>
  </div>
</body>
</html>
