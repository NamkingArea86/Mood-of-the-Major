<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<title>Profile</title>
<style>
  * { box-sizing: border-box; font-family: 'Inter', 'IBM Plex Sans Thai', sans-serif; }
  body { margin: 0; background: #FBF8F1; padding: 40px 20px; display: flex; justify-content: center; }
  .card { background: #FFFFFF; border-radius: 16px; padding: 24px; width: 360px; text-align: center; }
  .avatar-ring { width: 70px; height: 70px; border-radius: 50%; border: 3px solid #7F77DD; padding: 3px; margin: 0 auto 12px; box-sizing: border-box; }
  .avatar-inner { width: 100%; height: 100%; border-radius: 50%; background: #EEEDFE; display: flex; align-items: center; justify-content: center; font-size: 26px; }
  .studentid { font-size: 14px; font-weight: 500; color: #1A1A1A; margin: 0; }
  .subinfo { font-size: 11px; color: #8A8A82; margin: 3px 0 16px; }
  .divider { border-top: 0.5px solid rgba(0,0,0,0.08); padding-top: 12px; text-align: left; }
  .post-row { background: #F5F1E8; border-radius: 10px; padding: 10px 12px; display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; }
  .post-row .text { font-size: 12px; color: #1A1A1A; }
  .icons { display: flex; gap: 8px; font-size: 13px; color: #8A8A82; }
</style>
</head>
<body>
  <div class="card">
    <div class="avatar-ring">
      <div class="avatar-inner">🌸</div>
    </div>
    <p class="studentid">นักศึกษารหัส 6512345</p>
    <p class="subinfo">วิศวกรรมศาสตร์ · อารมณ์ล่าสุด: เครียด</p>
    <div class="divider">
      <div class="post-row">
        <span class="text">😰 งานส่งพรุ่งนี้ยังไม่เสร็จเลย</span>
        <span class="icons">✏️ 🗑️</span>
      </div>
      <div class="post-row">
        <span class="text">😊 สอบผ่านแล้ว โล่งอก!</span>
        <span class="icons">✏️ 🗑️</span>
      </div>
    </div>
  </div>
</body>
</html>
